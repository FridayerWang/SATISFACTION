<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SATISFACTION</title>
<style>
:root{color-scheme:dark;--bg:#0d1020;--main:#eee7dc;--soft:rgba(238,231,220,.72);--line:rgba(255,255,255,.10);--serif:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow-x:hidden;background:radial-gradient(circle at 50% 24%,rgba(89,88,130,.18),transparent 34rem),linear-gradient(180deg,#111426 0%,var(--bg) 58%,#090b14 100%);color:var(--main);font-family:var(--serif)}main{width:min(94vw,1080px);padding:clamp(42px,7vw,82px) 0 clamp(50px,7vw,88px);text-align:center}.title{margin:0;font-size:clamp(34px,5vw,62px);font-weight:400;letter-spacing:.18em;line-height:1.05;text-indent:.18em;text-shadow:0 2px 22px rgba(255,224,174,.10)}.subtitle{margin:12px 0 34px;font-size:clamp(20px,2.7vw,31px);font-style:italic;font-weight:400;letter-spacing:.04em;color:var(--soft)}.scene-shell{width:min(100%,930px);margin:0 auto;padding:clamp(7px,.9vw,10px);border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.035);box-shadow:0 30px 80px rgba(0,0,0,.38),0 0 0 1px rgba(255,255,255,.02) inset}.scene{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:17px;background:#151521}.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none;transition:opacity 760ms cubic-bezier(.2,.72,.2,1)}#frame-a{opacity:0}.scene.restored #frame-a{opacity:1}.cat-hotspot{position:absolute;left:16.5%;top:28%;width:31%;height:58%;padding:0;border:0;outline:0;background:transparent;opacity:0;cursor:default;z-index:3}.quote{width:min(88vw,820px);margin:clamp(30px,4vw,46px) auto 0;color:var(--soft)}blockquote{margin:0;font-size:clamp(17px,2vw,22px);font-style:italic;font-weight:400;line-height:1.65;letter-spacing:.015em}cite{display:block;margin-top:10px;font-size:clamp(13px,1.4vw,15px);font-style:normal;letter-spacing:.08em;color:rgba(238,231,220,.52)}@media(max-width:620px){main{width:min(92vw,1080px)}.title{letter-spacing:.12em;text-indent:.12em}.subtitle{margin-bottom:25px}.scene-shell{border-radius:18px}.scene{border-radius:12px}}@media(prefers-reduced-motion:reduce){.scene img{transition:none}}
</style>
</head>
<body><main><header><h1 class="title">SATISFACTION</h1><p class="subtitle">brought it back</p></header><section class="scene-shell" aria-label="A quiet scene"><div class="scene" id="scene"><img id="frame-b" src="assets/frame-b.png" alt="A quiet fantasy room overlooking a distant kingdom." draggable="false"><img id="frame-a" src="assets/frame-a.png" alt="" aria-hidden="true" draggable="false"><button class="cat-hotspot" id="catHotspot" aria-label=""></button></div></section><footer class="quote"><blockquote>“Life can only be understood backwards; but it must be lived forwards.”</blockquote><cite>— Søren Kierkegaard</cite></footer></main><script>const scene=document.getElementById('scene'),hotspot=document.getElementById('catHotspot');hotspot.addEventListener('click',()=>{scene.classList.add('restored');hotspot.disabled=true});</script></body>
</html>
